version: "3.8"

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-docker-dev-key
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,web,db
      - DB_ENGINE=
      - DB_NAME=eduweb
      - DB_USER=eduweb
      - DB_PASSWORD=eduweb123
      - DB_HOST=db
      - DB_PORT=5432
    volumes:
      - .:/app
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=eduweb
      - POSTGRES_USER=eduweb
      - POSTGRES_PASSWORD=eduweb123
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  media_volume:
