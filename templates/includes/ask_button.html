{% if user.is_authenticated %}
    <a href="{% url 'questions:ask' %}" class="btn btn-primary flex-shrink-0">Задать вопрос</a>
{% else %}
    <a href="{% url 'core:login' %}?next={% url 'questions:ask' %}"
       class="btn btn-outline-primary flex-shrink-0"
       title="Войдите, чтобы задать вопрос">
        Войдите, чтобы задать вопрос
    </a>
{% endif %}
